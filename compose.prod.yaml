# Production stack: Odoo 19 + PostgreSQL 17 behind Caddy (HTTPS, Let's Encrypt via GoDaddy DNS-01)
# Usage: docker compose -f compose.prod.yaml up -d --build
services:
  db:
    image: postgres:17
    env_file: .env.prod
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
    volumes:
      - prod-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.prod
    environment:
      HOST: db
      USER: odoo
      # PASSWORD (DB password for Odoo) comes from .env.prod
    volumes:
      - prod-odoo-data:/var/lib/odoo
      - ./config/odoo.prod.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons:ro
    # no published ports: only reachable through Caddy
    restart: always

  caddy:
    # stock Caddy + GoDaddy DNS plugin, see caddy/Dockerfile
    build: ./caddy
    image: eden-caddy-godaddy
    depends_on:
      - odoo
    env_file: .env.prod
    ports:
      # TEMPORARY until go-live: HTTPS on 8069 only.
      # At go-live: "443:443", and see caddy/Caddyfile.
      - "8069:8069"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: always

volumes:
  prod-db-data:
  prod-odoo-data:
  caddy-data:
  caddy-config:
