# Development stack: Odoo 19 + PostgreSQL 17, reachable at http://localhost:8069
# Usage: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - dev-odoo-data:/var/lib/odoo
      - ./config/odoo.dev.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons:ro
    # auto-reload Python on change, re-read XML/QWeb from disk
    command: ["--dev=reload,xml,qweb"]
    restart: unless-stopped

volumes:
  dev-db-data:
  dev-odoo-data:
